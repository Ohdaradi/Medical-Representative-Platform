apiVersion: v1
kind: Namespace
metadata:
  name: iter-pharma
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iter-api-config
  namespace: iter-pharma
data:
  NODE_ENV: production
  PORT: "5000"
  CORS_ORIGIN: https://mr.iter.example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iter-api
  namespace: iter-pharma
spec:
  replicas: 3
  selector: { matchLabels: { app: iter-api } }
  template:
    metadata: { labels: { app: iter-api } }
    spec:
      containers:
        - name: api
          image: REPLACE_WITH_ECR_REPOSITORY/iter-api:TAG
          ports: [{ containerPort: 5000 }]
          envFrom:
            - configMapRef: { name: iter-api-config }
            - secretRef: { name: iter-api-secrets }
          readinessProbe: { httpGet: { path: /health, port: 5000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 5000 }, initialDelaySeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: iter-api, namespace: iter-pharma }
spec: { selector: { app: iter-api }, ports: [{ port: 5000, targetPort: 5000 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: iter-api, namespace: iter-pharma }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: iter-api }
  minReplicas: 3
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
